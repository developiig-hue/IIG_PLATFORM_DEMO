name: Build Digest PDF QA
on:
  push:
    branches: [main, feature/scheduler-orchestration-production]
    paths:
      - 'scripts/build_digest_pdf.py'
      - 'scripts/build_digest_release.py'
      - 'content/public-news.json'
      - 'content/public-advice.json'
      - 'assets/*.webp'
      - '.github/workflows/build-digest-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer
        run: |
          pip install playwright pypdf
          playwright install --with-deps chromium
      - name: Render current approved content to PDF
        run: python scripts/build_digest_pdf.py
      - name: PDF structural QA
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='digest/IIG-Monthly-Digest-2026-09.pdf'
          r=PdfReader(p)
          assert len(r.pages)==2, len(r.pages)
          text=' '.join((x.extract_text() or '') for x in r.pages)
          assert 'file://' not in text
          assert '15.09.2026, 14:51' not in text
          assert 'основних новин' in text
          assert 'регуляторних новин' in text
          assert 'ЗАКОНОДАВСТВО ТА РЕГУЛЮВАННЯ ЕНЕРГЕТИКИ' in text
          links=sum(len(x.get('/Annots',[])) for x in r.pages)
          assert links>=25, links
          print('DIGEST_PDF_QA_PASS',{'pages':len(r.pages),'links':links})
          PY
      - name: Retain PDF for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: IIG-Monthly-Digest-2026-09-QA
          path: digest/IIG-Monthly-Digest-2026-09.pdf
          if-no-files-found: error
          retention-days: 7
