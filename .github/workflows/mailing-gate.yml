name: IIG Mailing Center Gate
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'assets/admin-mailing.js'
      - 'assets/admin-contacts.js'
      - 'assets/admin-radar.js'
      - 'RADAR_PROTOCOL.md'
      - 'admin-ua.html'
      - 'MAILING_PROTOCOL.md'
      - '.github/workflows/mailing-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mailing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --omit=dev
      - name: Backend syntax gate
        run: npm run check
      - name: Verify mail dependencies
        run: node -e "Promise.all([import('nodemailer'),import('@fastify/formbody'),import('xlsx')]).then(()=>console.log('MAILING_DEPENDENCIES_OK'))"
      - name: Storage tests
        run: npm test
      - name: Mailing contract markers
        working-directory: .
        run: |
          grep -q 'IIG_MAILING_V1' backend/src/server.mjs
          grep -q 'PDF_NOT_EQUAL_TO_ADMIN1_APPROVED_CURRENT' backend/src/server.mjs
          grep -q 'ADMIN_1_REQUIRED_TO_START_MAILING' backend/src/server.mjs
          grep -q 'UNSUBSCRIBE / SUPPRESSED' assets/admin-contacts.js
          grep -q 'IIG_MAILING_V33' MAILING_PROTOCOL.md
          grep -q 'IIG_RADAR_EPHEMERAL_V39' RADAR_PROTOCOL.md
          grep -q 'RADAR · ПОШУК ПОТЕНЦІЙНИХ КЛІЄНТІВ' admin-ua.html
          grep -q '/api/v1/radar/search' assets/admin-radar.js
          grep -q '/api/v1/radar/prospects' assets/admin-radar.js
          grep -q 'DEMO TEST RADAR' assets/admin-radar.js
          grep -q 'radar-test-latest.json' assets/admin-radar.js
          grep -q 'radarExportExcel' admin-ua.html
          grep -q 'radarResetGeneration' admin-ua.html
          grep -q 'IIG_RADAR_Target_Search_' assets/admin-radar.js
          grep -q 'IIG_RADAR_DEMO_EPHEMERAL_V39' RADAR_PROTOCOL.md
          grep -q 'IIG_CONTACT_BASE_IMPORT_V34' MAILING_PROTOCOL.md
          grep -q 'app.post("/api/v1/contacts/import"' backend/src/server.mjs
          grep -q 'ADMIN_2_REQUIRED' backend/src/server.mjs
          grep -q 'importRecipientBase' assets/admin-contacts.js
          grep -q 'ЗАПУСТИТИ РОЗСИЛКУ · ADMIN_1' admin-ua.html
          grep -q 'IIG_MAIL_TEMPLATE_EDITOR_V35' MAILING_PROTOCOL.md
          grep -q 'app.get("/api/v1/mailing/template/:language"' backend/src/server.mjs
          grep -q 'saveMailTemplate' backend/src/mailing-store.mjs
          grep -q 'mailTemplateLanguage' admin-ua.html
          grep -q 'data-mail-cmd="bold"' admin-ua.html
          grep -q 'IIG_UA_MAIL_MASTER_V36' MAILING_PROTOCOL.md
          grep -q '{{name}}' backend/src/mailing-store.mjs
          grep -q 'Шановний {{name}} !' backend/src/mailing-store.mjs
          grep -q 'РОЗМІСТИТИ ПРОЄКТ' backend/src/mailing-store.mjs
