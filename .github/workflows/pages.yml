name: Deploy IIG Public Demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  security-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security exposure guard
        run: |
          ! grep -RqiE '(DATABASE_URL|REDIS_URL|SECRET_KEY|PRIVATE_KEY|PASSWORD=|postgresql://|redis://)' --exclude-dir=.git --exclude-dir=.github index.html industry.html case.html advice.html financing.html news.html forms.html about.html digest .nojekyll README.md
      - name: STEP 26 public surface smoke
        run: |
          for f in index.html industry.html case.html advice.html financing.html news.html forms.html about.html digest/2026-09-review.html; do test -s "$f"; done
          grep -q "INDUSTRY INTELLIGENCE GENERATION" index.html
          grep -q "IIG Industrial Energy Intelligence Digest" index.html
          grep -q "PRACTICAL INNOVATION / KNOW-HOW" industry.html
          grep -q "PRIMARY SOURCES" case.html
          grep -q "Відкрити аналітику IIG" advice.html
          grep -q "FINANCING INTELLIGENCE" financing.html
          grep -q "VERIFIED INDUSTRIAL ENERGY INTELLIGENCE" news.html
          grep -q "DEMO MODE" forms.html
          grep -q "Investment Industrial Group" about.html
          grep -q "MONTHLY DIGEST" digest/2026-09-review.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
