name: Deploy IIG Public Demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  security-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security exposure guard
        run: |
          ! grep -RqiE '(DATABASE_URL|REDIS_URL|SECRET_KEY|PRIVATE_KEY|PASSWORD=|postgresql://|redis://)' --exclude-dir=.git --exclude-dir=.github index.html industry.html case.html advice.html financing.html news.html forms.html about.html digest .nojekyll README.md
      - name: STEP 26 public surface smoke
        run: |
          for f in index.html industry.html case.html advice.html financing.html news.html forms.html about.html digest/2026-09-review.html assets/iig.css assets/iig.js; do test -s "$f"; done
          grep -q 'lang="uk"' index.html
          grep -q 'translate="no"' index.html
          grep -q '>IIG<' index.html
          grep -q "INDUSTRY INTELLIGENCE" index.html
          grep -q "ПОРАДИ ГОЛОВНОГО ІНЖЕНЕРА" index.html
          grep -q "engineer-photo" index.html
          grep -q "PRACTICAL INNOVATION / KNOW-HOW" industry.html
          grep -q "ПЕРВИННЕ ДЖЕРЕЛО" case.html
          grep -q "Відкрити аналітику IIG" advice.html
          grep -q "FINANCING INTELLIGENCE" financing.html
          grep -q "VERIFIED INDUSTRIAL ENERGY INTELLIGENCE" news.html
          grep -q "DEMO MODE" forms.html
          grep -q "Investment Industrial Group" about.html
          grep -q "MONTHLY DIGEST" digest/2026-09-review.html
          grep -q "@media(max-width:700px)" assets/iig.css
          grep -q "setLang('ua',false)" assets/iig.js
          grep -q "images.unsplash.com" assets/iig.css
      - name: UA default and IIG trademark red-team
        run: |
          python - <<'PY'
          import pathlib,re,sys
          files=['index.html','industry.html','case.html','advice.html','financing.html','news.html','forms.html','about.html']
          bad=[]
          ru=re.compile(r'\b(промышленн|финансировани|советы главного|новости и аналитика|формирование отраслевой|разведки|солнечная электростанция|хранилище энергии)\w*',re.I)
          for f in files:
              t=pathlib.Path(f).read_text(encoding='utf-8')
              visible=re.sub(r'data-en="[^"]*"','',t)
              if ru.search(visible): bad.append(f+' contains Russian UI text')
              if any(x in t for x in ('ИИГ','ИІГ','ІІГ')): bad.append(f+' translates IIG trademark')
          if bad:
              print('\n'.join(bad));sys.exit(1)
          print('UA native layer + immutable IIG trademark OK')
          PY
      - name: STEP 26 internal navigation red-team
        run: |
          python - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('.')
          pages=['index.html','industry.html','case.html','advice.html','financing.html','news.html','forms.html','about.html']
          missing=[]
          for page in pages:
              text=(root/page).read_text(encoding='utf-8')
              for href in re.findall(r'href=["\']([^"\']+)["\']',text):
                  if href.startswith(('http://','https://','mailto:','#','javascript:','data:')): continue
                  target=href.split('#',1)[0].split('?',1)[0]
                  if not target: continue
                  p=(root/page).parent/target
                  if p.is_dir(): p=p/'index.html'
                  if not p.exists(): missing.append(f'{page} -> {href}')
          if missing:
              print('BROKEN INTERNAL LINKS:');print('\n'.join(missing));sys.exit(1)
          print('Internal navigation OK')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
