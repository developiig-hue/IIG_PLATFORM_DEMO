name: Deploy IIG Public Demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  security-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare approved-only news and remove demo listings
        run: python scripts/prepare_public_news.py
      - name: Verify nine news photographs and same-sector fallback routing
        run: python scripts/check_news_images.py
      - name: Normalize UA and protect IIG trademark
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=[Path(x) for x in ['index.html','industry.html','case.html','advice.html','financing.html','finance-news.html','news.html','article.html','forms.html','about.html']]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              s=s.replace('<html lang="uk">','<html lang="uk" translate="no">').replace('<html lang="uk" translate="no" translate="no">','<html lang="uk" translate="no">')
              if '<meta name="google" content="notranslate">' not in s:s=s.replace('<head>','<head><meta name="google" content="notranslate">',1)
              s=s.replace('ИІГ','IIG').replace('ІІГ','IIG').replace('ИИГ','IIG')
              if '<body class="notranslate">' not in s and '<body>' in s:s=s.replace('<body>','<body class="notranslate">',1)
              if p.as_posix()=='digest/2026-09-review.html' and 'download-pdf.js' not in s:
                  s=s.replace('</body>','<script src="download-pdf.js"></script></body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript syntax guard
        run: |
          node --check assets/admin.js
          node --check assets/public-news.js
          node --check assets/admin-contacts.js
      - name: STEP 26 Admin MASTER acceptance
        run: python scripts/check_step26_admin.py
      - name: Security exposure guard
        run: |
          ! grep -RqiE '(DATABASE_URL|REDIS_URL|SECRET_KEY|PRIVATE_KEY|PASSWORD=|postgresql://|redis://)' --exclude-dir=.git --exclude-dir=.github index.html industry.html case.html advice.html financing.html finance-news.html news.html forms.html about.html digest .nojekyll README.md
      - name: Public surface smoke
        run: |
          for f in index.html industry.html case.html advice.html financing.html finance-news.html news.html article.html forms.html about.html admin.html admin-ua.html assets/iig.css assets/iig.js assets/public-news.js content/public-news.json baze_foto_news/manifest.json; do test -s "$f"; done
          grep -q 'IIG' index.html
          grep -q 'ПОРАДИ ГОЛОВНОГО ІНЖЕНЕРА' index.html
          grep -q 'FINANCING INTELLIGENCE' financing.html
          for f in index.html industry.html news.html article.html; do grep -q 'assets/public-news.js' "$f"; done
      - name: Internal navigation red-team
        run: |
          python - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('.');pages=['index.html','industry.html','case.html','advice.html','financing.html','finance-news.html','news.html','article.html','forms.html','about.html'];missing=[]
          for page in pages:
              text=(root/page).read_text(encoding='utf-8')
              for href in re.findall(r'href=["\']([^"\']+)["\']',text):
                  if href.startswith(('http://','https://','mailto:','#','javascript:','data:')):continue
                  if '${' in href or '{{' in href or '<%' in href:continue
                  target=href.split('#',1)[0].split('?',1)[0]
                  if not target:continue
                  p=(root/page).parent/target
                  if p.is_dir():p=p/'index.html'
                  if not p.exists():missing.append(f'{page} -> {href}')
          if missing:print('BROKEN INTERNAL LINKS:');print('\n'.join(missing));sys.exit(1)
          print('Internal navigation OK')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
