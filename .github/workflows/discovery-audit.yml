name: IIG News Source Discovery Production
on:
  push:
    branches: [feature/news-discovery-production, feature/content-engine-production]
    paths:
      - 'scripts/news_source_discovery.py'
      - 'scripts/news_registry.py'
      - 'scripts/verify_full_discovery.py'
      - 'tests/test_news_source_discovery.py'
      - 'tests/test_news_registry.py'
      - 'content/discovery/IIG_news_source_registry_260.json'
      - '.github/workflows/discovery-audit.yml'
      - 'scripts/content_engine.py'
      - 'scripts/verify_content_engine.py'
      - 'tests/test_content_engine.py'
  workflow_dispatch:
# Weekly schedule delegated to editorial-refresh.yml; workflow_dispatch remains available.
concurrency:
  group: iig-news-discovery-production
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and portability tests
        run: |
          python scripts/news_registry.py
          python -m unittest tests.test_news_registry tests.test_news_source_discovery tests.test_content_engine
      - name: Full 260-source Discovery — strict P1 then P2
        run: python scripts/news_source_discovery.py --workers 20 --timeout 5 --max-age-days 45
      - name: Production acceptance gate
        run: python scripts/verify_full_discovery.py
      - name: Content Engine handoff smoke
        run: |
          python scripts/content_engine.py weekly
          python scripts/content_engine.py verify
          python scripts/verify_content_engine.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('content/content-engine-report.json').read_text())
          assert r['discovery_received'] > 0, 'LIVE_HANDOFF_BLOCKED: zero Discovery candidates received'
          assert r['discovery_research_packets'] > 0, 'LIVE_HANDOFF_BLOCKED: zero safe Discovery research packets'
          print('CONTENT_ENGINE_LIVE_HANDOFF_PASS', {'received':r['discovery_received'],'research_packets':r['discovery_research_packets']})
          PY
      - name: Upload full per-source report and handoff
        uses: actions/upload-artifact@v4
        with:
          name: iig-full-discovery-260-${{ github.run_id }}
          path: |
            content/discovery-report.json
            content/candidates/discovered-candidates.json
            content/review-queue/*.json
            content/content-engine-report.json
          if-no-files-found: error
          retention-days: 30
# NO_AUTO_PUBLISH: Discovery and Content Engine have read-only repository permission.
