name: IIG Admin Review Production
on:
  push:
    branches: [main, feature/admin-review-publication]
    paths:
      - 'scripts/admin_review.py'
      - 'scripts/verify_admin_review.py'
      - 'tests/test_admin_review.py'
      - 'ADMIN_REVIEW_PROTOCOL.md'
      - 'content/moderation-policy.json'
      - '.github/workflows/admin-review.yml'
      - 'scripts/image_rights_robot.py'
      - 'scripts/quality_gate.py'
      - 'scripts/content_engine.py'
      - 'content/candidates/**'
      - 'content/image-moderation/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-review-${{ github.sha }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and governance tests
        run: python -m unittest tests.test_content_engine tests.test_quality_gate tests.test_image_rights_robot tests.test_admin_review
      - name: Build isolated portable Image Rights handoff
        run: |
          python - <<'PY'
          import hashlib,json,os
          os.makedirs('content/image-rights',exist_ok=True)
          queue=[]
          for route,title,image in [
              ('news','IIG Admin Review acceptance NEWS','baze_foto_news_energy.jpg'),
              ('chief_engineer_advice','IIG Admin Review acceptance ADVICE',None)
          ]:
              item={'title':title,'type':'NEWS' if route=='news' else 'CHIEF_ENGINEER_ADVICE'}
              h=hashlib.sha256(json.dumps(item,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              rec={'item_sha256':h,'route':route,'item':item}
              if route=='news':
                  rec.update({'image_required':True,'selected_image':image,'image_decision':'APPROVED'})
              queue.append(rec)
          artifact='content/image-rights/image-rights-admin-review-acceptance.json'
          json.dump({
              'schema':'iig.image-rights.v1',
              'status':'READY_FOR_ADMIN_REVIEW',
              'publish_authority':'ADMIN_ONLY',
              'auto_publish':False,
              'admin_review_queue':queue
          },open(artifact,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump({
              'schema':'iig.image-rights-report.v1',
              'status':'PASS',
              'artifact':artifact,
              'evaluated_total':len(queue),
              'passed_total':len(queue),
              'blocked_total':0,
              'next_state':'ADMIN_REVIEW'
          },open('content/image-rights-report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('ADMIN_REVIEW_PORTABLE_UPSTREAM_FIXTURE_PASS',{'items':len(queue)})
          PY
      - name: Prepare Admin Review queue without making a decision
        run: |
          python scripts/admin_review.py prepare
          python scripts/admin_review.py verify
          python scripts/verify_admin_review.py
      - name: Prove live boundary
        run: |
          python - <<'PY'
          import json
          a=json.load(open('content/image-rights-report.json',encoding='utf-8'))
          r=json.load(open('content/admin-review-report.json',encoding='utf-8'))
          q=json.load(open('content/admin-review/review-queue.json',encoding='utf-8'))
          assert a['next_state']=='ADMIN_REVIEW'
          assert r['next_state']=='ADMIN_DECISION_REQUIRED'
          assert all(x['state']=='PENDING_ADMIN_DECISION' for x in q['queue'])
          assert q['auto_approve'] is False and q['auto_publish'] is False
          print('ADMIN_REVIEW_LIVE_CHAIN_PASS',{'queue_total':r['queue_total'],'pending_total':r['pending_total']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: admin-review-audit-${{ github.sha }}
          path: |
            content/admin-review-report.json
            content/admin-review/review-queue.json
          retention-days: 30
