name: IIG Moderated Content Engine
on:
  push:
    branches: [main, feature/content-engine-production]
    paths:
      - 'scripts/content_engine.py'
      - 'content/moderation-policy.json'
      - 'content/candidates/**'
      - 'content/discovery/IIG_news_source_registry_260.json'
      - 'content/discovery-report.json'
      - 'scripts/verify_full_discovery.py'
      - 'scripts/news_registry.py'
      - 'tests/test_news_registry.py'
      - 'tests/test_content_engine.py'
      - 'scripts/verify_content_engine.py'
      - 'NEWS_ROBOT_SOURCE_PROTOCOL.md'
      - 'CONTENT_ENGINE_PROTOCOL.md'
      - '.github/workflows/content-engine.yml'
  schedule:
    # Every Monday 06:15 UTC. Generation only; never publication.
    - cron: '15 6 * * 1'
    # First day monthly 06:30 UTC. Digest draft from approved monthly pool only.
    - cron: '30 6 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: weekly or monthly
        required: true
        default: weekly
        type: choice
        options: [weekly, monthly]
concurrency:
  group: iig-content-engine-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  generate-review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select generation mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}";
          elif [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H%M)" = "0630" ]; then MODE=monthly;
          else MODE=weekly; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Verify portable 260-source registry contract
        run: |
          python scripts/news_registry.py
          python -m unittest tests.test_news_registry tests.test_content_engine
      - name: Verify full 260-source Discovery when production report is present
        run: |
          if [ -f content/discovery-report.json ]; then
            python scripts/verify_full_discovery.py
          else
            echo "E2E_TEST_ONLY: no full Discovery report; FULL_DISCOVERY_PASS is not claimed"
          fi
      - name: Generate NEWS + CHIEF ENGINEER ADVICE READY_FOR_REVIEW outputs
        run: python scripts/content_engine.py "${{ steps.mode.outputs.mode }}"
      - name: Verify seven-robot architecture, dual-output routing and ADMIN_ONLY gate
        run: python scripts/content_engine.py verify
      - name: Production Content Engine acceptance
        run: python scripts/verify_content_engine.py
      - name: Upload moderation queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: iig-${{ steps.mode.outputs.mode }}-ready-for-review-${{ github.run_id }}
          path: |
            content/review-queue/*.json
            content/content-engine-report.json
          if-no-files-found: error
          retention-days: 30
# SECURITY/GOVERNANCE HARD RULE:
# This workflow has contents:read only. It cannot commit, deploy, publish or mail.
# News Source / Discovery -> Content Engine -> NEWS + CHIEF_ENGINEER_ADVICE is one seven-robot architecture; the two routes are outputs, not extra robots.
# Publication and Digest mailing are separate administrator actions after final moderation.
