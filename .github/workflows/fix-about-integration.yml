name: Fix About IIG integration
on:
  push:
    paths:
      - '.github/workflows/fix-about-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix About navigation and homepage teaser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#about">About IIG</a>', '<a href="about.html">About IIG</a>')
          old='''<section id="about" class="about"><h2>About IIG</h2><p><b>INDUSTRY INTELLIGENCE GENERATION (IIG)</b> — Industrial Energy Intelligence Platform для промислових компаній, інженерів, інвесторів та керівників. Платформа об’єднує реальні проєкти, інженерні рішення, технології, фінансування, регуляторні зміни та практичний досвід.</p></section>'''
          new='''<section id="about" class="about"><h2>About IIG</h2><p><b>INDUSTRY INTELLIGENCE GENERATION (IIG)</b> — Industrial Energy Intelligence Platform для промислових компаній, інженерів, інвесторів та керівників. Платформу розвиває команда <b>Investment Industrial Group s.r.o. (IIG)</b> — чеської інжинірингової компанії з багаторічним досвідом у промисловості та промисловій енергетиці.</p><p>Досвід команди охоплює <b>CHP / когенерацію, CCGT, газопоршневі та газотурбінні установки, котельні, теплові системи, утилізацію тепла, біомасу та промислову енергетичну інфраструктуру</b>.</p><p><a class="sectionlink" href="about.html">Повна інформація про IIG · UA / EN →</a></p></section>'''
          if old not in s:
              raise SystemExit('Expected About block not found; refusing unsafe patch')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name "IIG Platform Bot"
          git config user.email "develop.iig@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: connect homepage About IIG to full UA EN page"
          git push
