# Include inside the paid-domain HTTPS server{} block.
# Secure Admin is owned by the backend: /admin/ -> password -> MFA -> HttpOnly session -> RBAC.
# Do NOT inject browser-controlled role headers.

location /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-IIG-Admin-Role "";
    proxy_set_header X-IIG-Proxy-Secret "";
    add_header Cache-Control "no-store" always;
}

location /api/v1/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-IIG-Admin-Role "";
    proxy_set_header X-IIG-Proxy-Secret "";
    client_max_body_size 25m;
    proxy_request_buffering off;
}

location = /digest/current.pdf {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
location = /digest/current-en.pdf {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
