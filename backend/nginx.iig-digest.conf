# Include inside the paid-domain HTTPS server{} block.
# IMPORTANT: strip any browser-supplied X-IIG-Admin-Role and inject it only
# after your real Admin authentication layer has authenticated the user.

location /api/v1/digest/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Replace $iig_admin_role with a value set ONLY by trusted auth/proxy logic.
    proxy_set_header X-IIG-Admin-Role $iig_admin_role;

    client_max_body_size 25m;
    proxy_request_buffering off;
}

location = /digest/current.pdf {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location /api/v1/editorial/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-IIG-Admin-Role $iig_admin_role;
}

# Public POST + protected Admin GET/export/processing on the same stable API path.
# IMPORTANT: strip any client-supplied X-IIG-Admin-Role. Inject a role only for authenticated Admin requests.
location /api/v1/requests {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-IIG-Admin-Role $iig_admin_role;
    client_max_body_size 256k;
}
