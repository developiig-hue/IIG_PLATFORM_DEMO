services:
  - type: web
    name: iig-digest-publication-service
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: IIG_DIGEST_STORAGE
        value: s3
      - key: IIG_S3_BUCKET
        sync: false
      - key: IIG_S3_REGION
        sync: false
      - key: IIG_S3_ENDPOINT
        sync: false
      - key: IIG_S3_ACCESS_KEY_ID
        sync: false
      - key: IIG_S3_SECRET_ACCESS_KEY
        sync: false
      - key: IIG_S3_FORCE_PATH_STYLE
        value: "false"
      - key: IIG_ALLOWED_ORIGINS
        sync: false
      - key: IIG_ADMIN1_TOKEN
        sync: false
      - key: IIG_ADMIN2_TOKEN
        sync: false
