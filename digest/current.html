<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIG Monthly Digest — current</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6f8;color:#0b3158}.wrap{max-width:720px;margin:10vh auto;padding:28px}.card{background:#fff;border:1px solid #d5e0e7;border-radius:14px;padding:28px;box-shadow:0 8px 28px #0b315815}h1{margin-top:0}.btn{display:inline-block;margin-top:14px;padding:13px 18px;border-radius:8px;background:#0b5f99;color:#fff;text-decoration:none;font-weight:800}.muted{color:#607789}</style></head><body><main class="wrap"><section class="card"><h1>ПОТОЧНИЙ ДАЙДЖЕСТ IIG</h1><p id="state">Перевіряємо актуальний випуск…</p><p class="muted">Публічна сторінка не підміняє завантаження переходом у NEWS.</p><a id="download" class="btn" hidden>ЗАВАНТАЖИТИ ДАЙДЖЕСТ ↓</a></section></main><script>(async()=>{const s=document.getElementById('state'),a=document.getElementById('download'),setCurrent=(url,label)=>{a.href=url;a.hidden=false;a.setAttribute('download','');a.textContent='ЗАВАНТАЖИТИ PDF ДАЙДЖЕСТ ↓';s.textContent=label};try{const r=await fetch('/api/v1/digest/current',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.status!=='CURRENT'||!d.public_url||!/\.pdf(?:$|[?#])/i.test(d.public_url))throw Error('NO_CURRENT_PDF');const rev=d.revision||d.updated_at||Date.now(),url=d.public_url+(d.public_url.includes('?')?'&':'?')+'v='+encodeURIComponent(rev);setCurrent(url,'Актуальний випуск: '+(d.issue||'CURRENT'));return}catch(e){}try{const staticUrl='current.pdf?v='+Date.now(),r=await fetch(staticUrl,{method:'HEAD',cache:'no-store'});if(!r.ok)throw Error('NO_STATIC_CURRENT');setCurrent(staticUrl,'Актуальний PDF опубліковано.');return}catch(e){}s.innerHTML='<b>Поточний PDF ще не опубліковано.</b><br>ADMIN_1 затверджує макет; ADMIN_1 або ADMIN_2 завантажує / замінює CURRENT PDF через захищений upload endpoint.'})();</script></body></html>
